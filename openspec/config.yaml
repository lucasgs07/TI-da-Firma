schema: spec-driven

githubCopilot:
  cloudAgent: true

context: |
  Projeto: Plataforma de Gestão Interna Empresarial.
  Antes de elaborar propostas ou especificações, consulte:
  - docs/project-overview.md
  - docs/domain-model.md

  O projeto busca centralizar o gerenciamento de chamados,
  ativos, tarefas, usuários e departamentos.
  O backend, banco de dados, autenticação, APIs e regras de
  negócio serão desenvolvidos com o Xano.
  O frontend será implementado em Reflex.
  A inteligência artificial deve apoiar os usuários, sem
  substituir decisões de responsáveis humanos.
  Preserve o escopo do MVP e registre decisões técnicas pendentes
  em vez de assumir respostas sem confirmação.

rules:
  proposal:
    - Descreva o problema, os objetivos e o escopo da mudança.
    - Considere as funcionalidades previstas para o MVP.
    - Registre dúvidas e decisões técnicas pendentes.
    - Evite incluir funcionalidades não solicitadas.
  specs:
    - Escreva requisitos claros e critérios de aceitação verificáveis.
    - Considere os diferentes perfis de acesso do sistema.
    - Não invente regras de negócio ou atributos do banco de dados.
    - Diferencie requisitos do MVP de melhorias futuras.
  tasks:
    - Divida o trabalho em tarefas pequenas e verificáveis.
    - Identifique dependências entre tarefas.
    - Inclua testes ou critérios de validação quando aplicável.
    - Considere segurança e controle de acesso.

operations:
  apply:
    guidance:
      - Leia e siga as especificações e tarefas aprovadas.
      - Implemente somente o escopo definido na mudança.
      - Evite alterações não relacionadas à tarefa.
      - Execute testes adequados e informe os resultados.
      - Não considere uma tarefa concluída sem verificar sua implementação.
  archive:
    guidance:
      - Confira se a implementação corresponde às especificações.
      - Registre pendências ou limitações relevantes.
      - Não afirme que testes passaram sem evidências.